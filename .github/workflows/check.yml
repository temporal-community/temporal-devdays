name: check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - run: make setup
      - run: make check

  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install the Temporal CLI
        run: |
          curl -sSfL "https://temporal.download/cli/archive/latest?platform=linux&arch=amd64" -o temporal.tar.gz
          tar -xzf temporal.tar.gz temporal
          sudo mv temporal /usr/local/bin/
          temporal --version
      - name: Start the dev server
        run: |
          nohup temporal server start-dev --headless > temporal.log 2>&1 &
          for i in $(seq 1 30); do temporal operator cluster health && break; sleep 1; done
      - run: make setup
      - run: make check-live
